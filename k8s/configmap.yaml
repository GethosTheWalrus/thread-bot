apiVersion: v1
kind: ConfigMap
metadata:
  name: threadbot-config
  namespace: threadbot
data:
  # Set true only after registering these attributes in the Temporal namespace:
  # ThreadBotWorkspaceId (Keyword), ThreadBotAgentId (Keyword), ThreadBotRunMode (Keyword).
  TEMPORAL_SEARCH_ATTRIBUTES_ENABLED: "false"
  # Database — external Postgres at 192.168.69.11
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@192.168.69.11:5432/threadbot"
  # Temporal — existing cluster-internal service
  TEMPORAL_HOST: "temporal-frontend.temporal.svc.cluster.local"
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "chatbot-task-queue"
  TEMPORAL_PAYLOAD_CODEC_ENABLED: "true"
  # LLM defaults (overridable via Settings UI)
  LLM_API_URL: "http://192.168.69.35:11434/v1"
  LLM_API_KEY: "ollama"
  LLM_MODEL: "gemma4:e2b"
  LLM_TEMPERATURE: "1.0"
  LLM_MAX_TOKENS: "4096"
  # Server
  HOST: "0.0.0.0"
  PORT: "8000"
  # Redis — external Redis instance
  REDIS_URL: "redis://192.168.69.5:6379"
  REDIS_DB: "3"
  # Autonomy — enable background agents, side effects, and heartbeats.
  # SECURITY_MODE=local allows unauthenticated local access; admin_token requires API tokens.
  SECURITY_MODE: "local"
  AUTONOMY_ENABLED: "true"
  AUTONOMY_SIDE_EFFECTS_ENABLED: "true"
  AUTONOMY_WEBHOOKS_ENABLED: "false"
  # Per-feature autonomy gates (enable all for full background-agent operation).
  AGENTS_ENABLED: "true"
  AGENTS_MANUAL_RUN_ENABLED: "true"
  AGENTS_SCHEDULES_ENABLED: "true"
  AGENTS_CONNECTORS_ENABLED: "true"
  AGENTS_ACTIONS_ENABLED: "true"
  AGENTS_APPROVALS_ENABLED: "true"
  AGENTS_HANDOFFS_ENABLED: "true"
  AGENTS_REPLAY_ENABLED: "true"
  AGENTS_CANARY_ENABLED: "true"
  AGENTS_REACHY_ACTIONS_ENABLED: "false"
