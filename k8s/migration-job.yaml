apiVersion: batch/v1
kind: Job
metadata:
  name: threadbot-migrate
  namespace: threadbot
  labels:
    app: threadbot-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: threadbot-migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: migrate
          image: git.home:5050/mike/thread-bot/backend:e1472e8b
          imagePullPolicy: Always
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: threadbot-config
